<!-- ROLE-AWARE PROFILE PAGE — EXTERNAL CSS ONLY   -->
<!-- ============================================ -->

<ion-header>
  <ion-toolbar class="profile-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <ion-icon name="person-outline" class="header-icon"></ion-icon>
   Engineering Management System
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-content ion-padding">

  <!-- USER CARD -->
  <div class="user-card">
    <div class="user-card-header">
      <div class="user-avatar">
        {{ user?.full_name?.charAt(0) || 'U' }}
      </div>
      <div class="user-meta">
        <h2 class="user-fullname">
          {{ user?.full_name || 'Unknown User' }}
        </h2>
        <p class="user-username">
          &#64;{{ user?.username }}
        </p>
      </div>
    </div>

    <div class="user-role-badge">{{ roleLabel }}</div>
    <div class="user-group-label">{{ groupLabel }}</div>
  </div>

  <!-- ADMIN ONLY — Change Password -->
  <ion-list *ngIf="canChangePassword" class="menu-card">
    <ion-item button="true" class="menu-item" (click)="goToChangePassword()">
      <ion-icon name="key-outline" slot="start" class="menu-icon"></ion-icon>
      <ion-label class="menu-label">Change Password</ion-label>
      <ion-icon name="chevron-forward-outline" slot="end" class="menu-arrow"></ion-icon>
    </ion-item>
  </ion-list>

  <!-- ADMIN + SUPER ADMIN — Manage Users -->
  <ion-list *ngIf="canManageUsers" class="menu-card">
    <ion-item button="true" class="menu-item" (click)="goToUsers()">
      <ion-icon name="people-outline" slot="start" class="menu-icon"></ion-icon>
      <ion-label class="menu-label">Manage Users</ion-label>
      <ion-icon name="chevron-forward-outline" slot="end" class="menu-arrow"></ion-icon>
    </ion-item>
  </ion-list>

  <!-- LOGOUT -->
  <ion-button
    expand="block"
    (click)="logout()"
    class="logout-btn">
    <ion-icon name="log-out-outline" slot="start"></ion-icon>
    Logout
  </ion-button>

  <!-- VERSION -->
  <div class="version-info">
    Engineering Management System v3.0
  </div>

</ion-content>
