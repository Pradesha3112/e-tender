<!-- RAILWAY E-BILLING - LOGIN PAGE                -->
<!-- ============================================ -->

<ion-header>
  <ion-toolbar class="login-toolbar">
    <ion-title>
      <ion-icon name="train-outline" class="header-icon"></ion-icon>
      Engineering Management System
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">

  <div class="login-container">

    <!-- LOGIN HEADER -->
    <div class="login-header">
      <div class="logo-container">
        <div class="logo">
          <ion-icon name="receipt-outline"></ion-icon>
        </div>
      </div>
      <h1>Welcome Back!</h1>
      <p>Enter your credentials to continue</p>
    </div>

    <!-- LOGIN FORM -->
    <ion-card class="login-card">
      <ion-card-content>

        <!-- Username -->
        <ion-item class="form-item" lines="none">
          <ion-icon name="person-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input
            [(ngModel)]="username"
            placeholder="Username"
            label="Username"
            labelPlacement="floating"
            autocomplete="username"
            (keyup.enter)="login()"
          ></ion-input>
        </ion-item>

        <!-- Password (with eye toggle) -->
        <ion-item class="form-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input
            [(ngModel)]="password"
            placeholder="Password"
            label="Password"
            labelPlacement="floating"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            (keyup.enter)="login()"
          ></ion-input>
          <ion-button
            fill="clear"
            slot="end"
            class="eye-btn"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <ion-icon
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
            </ion-icon>
          </ion-button>
        </ion-item>

        <!-- Dummy Role Dropdown (cosmetic only) -->
        <ion-item class="form-item" lines="none">
          <ion-icon name="shield-checkmark-outline" slot="start" class="input-icon"></ion-icon>
          <ion-select
            [(ngModel)]="selectedRole"
            label="Login As"
            labelPlacement="floating"
            interface="action-sheet"
            class="role-select">
            <ion-select-option *ngFor="let r of roles" [value]="r.value">
              {{ r.label }}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="error-message">
          <ion-icon name="alert-circle-outline"></ion-icon>
          {{ errorMessage }}
        </div>

        <!-- Login Button -->
        <ion-button
          expand="block"
          (click)="login()"
          [disabled]="isLoading"
          class="login-btn"
        >
          <ion-spinner *ngIf="isLoading" name="crescent" slot="start"></ion-spinner>
          <ion-icon *ngIf="!isLoading" name="log-in-outline" slot="start"></ion-icon>
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </ion-button>

        <!-- Credentials Hint -->
        <div class="credentials-hint">
          <small>
            <ion-icon name="information-circle-outline"></ion-icon>
            Default admin: <strong>admin / admin</strong>
            &nbsp;·&nbsp;
            <a (click)="fillAdmin()">fill</a>
          </small>
        </div>

      </ion-card-content>
    </ion-card>

    <!-- Version -->
    <div class="version-info">
      <span>Engineering Management System v3.0 (RBAC)</span>
    </div>

  </div>
</ion-content>
